<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>ops-copilot — local test chat</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0b0c0f;
    color: #e6e6e6;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    padding: 12px 16px;
    border-bottom: 1px solid #23252b;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  header input {
    background: #16171c;
    border: 1px solid #2a2c34;
    color: #e6e6e6;
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 13px;
  }
  header input#agentUrl { flex: 1 1 320px; }
  header input#userEmail { flex: 0 1 220px; }
  header label { font-size: 12px; color: #8a8d98; }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg { max-width: 720px; padding: 10px 14px; border-radius: 10px; line-height: 1.45; font-size: 14px; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: #2b5cff; color: white; }
  .msg.agent { align-self: flex-start; background: #1b1d24; border: 1px solid #2a2c34; }
  .msg.system { align-self: center; background: transparent; color: #8a8d98; font-size: 12px; font-family: ui-monospace, monospace; }
  .msg.error { align-self: flex-start; background: #3a1414; border: 1px solid #6b1f1f; color: #ffb4b4; }
  .trace { margin-top: 8px; font-size: 12px; font-family: ui-monospace, monospace; color: #8a8d98; border-top: 1px solid #2a2c34; padding-top: 6px; }
  .trace .blocked { color: #ff8a8a; }
  footer {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    border-top: 1px solid #23252b;
  }
  footer textarea {
    flex: 1;
    resize: none;
    background: #16171c;
    border: 1px solid #2a2c34;
    color: #e6e6e6;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
  }
  footer button {
    background: #2b5cff;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 0 18px;
    font-size: 14px;
    cursor: pointer;
  }
  footer button:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
  <header>
    <label for="agentUrl">Agent URL</label>
    <input id="agentUrl" placeholder="https://ops-copilot-xxxx.onrender.com" />
    <label for="userEmail">User</label>
    <input id="userEmail" placeholder="support-t1@example.com" />
  </header>

  <div id="log"></div>

  <footer>
    <textarea id="input" rows="2" placeholder="Ask the ops copilot… (Enter to send, Shift+Enter for newline)"></textarea>
    <button id="send">Send</button>
  </footer>

<script>
  const $ = (id) => document.getElementById(id);
  const log = $('log');
  const agentUrl = $('agentUrl');
  const userEmail = $('userEmail');
  const input = $('input');
  const send = $('send');

  // Same-origin by default — this page is served by the agent itself.
  agentUrl.value = localStorage.getItem('ops_agent_url') || window.location.origin;
  userEmail.value = localStorage.getItem('ops_user_email') || 'support-t1@example.com';
  agentUrl.addEventListener('change', () => localStorage.setItem('ops_agent_url', agentUrl.value.trim()));
  userEmail.addEventListener('change', () => localStorage.setItem('ops_user_email', userEmail.value.trim()));

  function addMsg(text, cls) {
    const div = document.createElement('div');
    div.className = `msg ${cls}`;
    div.textContent = text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  async function ask() {
    const question = input.value.trim();
    const base = agentUrl.value.trim().replace(/\/$/, '');
    const user = userEmail.value.trim();

    if (!question) return;
    if (!base) { addMsg('Set the Agent URL above first.', 'error'); return; }
    if (!user.includes('@')) { addMsg('Set a valid user email above first.', 'error'); return; }

    addMsg(question, 'user');
    input.value = '';
    send.disabled = true;
    const pending = addMsg('…thinking', 'system');

    try {
      const res = await fetch(`${base}/ask`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question, user }),
      });
      const data = await res.json();
      pending.remove();

      if (!res.ok) {
        addMsg(data.error || `HTTP ${res.status}`, 'error');
        return;
      }

      const bubble = addMsg(data.answer || '(no answer)', 'agent');
      const trace = document.createElement('div');
      trace.className = 'trace';
      const blockedText = data.blocked?.length
        ? `<span class="blocked">refused: ${data.blocked.join(', ')}</span>`
        : 'nothing refused';
      trace.innerHTML = `${data.toolCalls ?? 0} tool call(s) — ${blockedText}`;
      bubble.appendChild(trace);
    } catch (err) {
      pending.remove();
      addMsg(`Request failed: ${err.message}`, 'error');
    } finally {
      send.disabled = false;
      input.focus();
    }
  }

  send.addEventListener('click', ask);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      ask();
    }
  });
</script>
</body>
</html>
